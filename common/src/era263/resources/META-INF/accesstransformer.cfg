# Holder.Reference#bindValue is protected. We need it to swap the value of an already-loaded worldgen
# registry entry, which is how both worldgen injectors work.
# Rebinding the holder is preferred over mutating a feature, which holds final, Codec-decoded lists.
public net.minecraft.core.Holder$Reference bindValue(Ljava/lang/Object;)V

# PatchedRegistry$LazyHolder is the only subclass that overrides it (RegistrySetBuilder$LazyHolder
# before 26.3), and a protected override of a public method is illegal - widening only the parent
# fails the Minecraft recompile with
#   bindValue(T) in net.minecraft.core.registries.PatchedRegistry.LazyHolder cannot override
#   bindValue(T) in net.minecraft.core.Holder.Reference
# On Fabric the same mismatch would instead be an IllegalAccessError at class load.
public net.minecraft.core.registries.PatchedRegistry$LazyHolder bindValue(Ljava/lang/Object;)V

# 26.3 needs nothing else.
