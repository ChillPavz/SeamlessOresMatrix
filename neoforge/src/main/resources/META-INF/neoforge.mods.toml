modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "${mod_id}.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}''' #mandatory (Supports multiline text)
[[dependencies.${mod_id}]]
modId = "neoforge" #mandatory
type = "required"
# NOT "[${neoforge_version},)" - that pins to the exact build we compiled against and rejects every
# earlier build of the same Minecraft version, since NeoForge versions are numbered <mc>.<build>.
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
# Cloth's mod id is 'cloth_config'; it PROVIDES 'cloth-config2', which is what fabric.mod.json uses.
# Required on both loaders. AFTER, so the config is read before worldgen.
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
# Every supported stone mod is optional: a variant exists only when its stone does.
[[dependencies.${mod_id}]]
modId = "wilderwild"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
