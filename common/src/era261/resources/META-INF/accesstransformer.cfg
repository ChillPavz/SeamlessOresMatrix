# Holder.Reference#bindValue is protected. We need it to swap the value of an already-loaded worldgen
# registry entry (a CONFIGURED feature before 26.3), which is how both worldgen injectors work.
# Rebinding the holder is preferred over mutating a configuration, which holds final, Codec-decoded lists.
public net.minecraft.core.Holder$Reference bindValue(Ljava/lang/Object;)V

# RegistrySetBuilder$LazyHolder is the only subclass that overrides it (PatchedRegistry$LazyHolder from
# 26.3, see src/era263), and a protected override of a public method is illegal - widening only the
# parent fails the Minecraft recompile with
#   bindValue(T) in net.minecraft.core.RegistrySetBuilder.LazyHolder cannot override
#   bindValue(T) in net.minecraft.core.Holder.Reference
# On Fabric the same mismatch would instead be an IllegalAccessError at class load.
public net.minecraft.core.RegistrySetBuilder$LazyHolder bindValue(Ljava/lang/Object;)V

# 26.1.x and 26.2 need nothing else.
